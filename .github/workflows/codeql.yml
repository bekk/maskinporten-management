name: CodeQL

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, so new CodeQL queries also run against unchanged code
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          # Kotlin cannot be analysed without a build, so compile it ourselves
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@v7

      - if: matrix.build-mode == 'manual'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # No Gradle or Kotlin daemon and no build cache, so the compiler really runs and CodeQL can trace it
      - if: matrix.build-mode == 'manual'
        name: Compile
        run: ./gradlew --no-daemon --no-build-cache -Pkotlin.compiler.execution.strategy=in-process classes

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
