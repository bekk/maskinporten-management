server:
  port: "$PORT:8080"

digdir:
  environment: "$?DIGDIR_ENVIRONMENT"

maskinporten:
  clientId: "$?MASKINPORTEN_CLIENT_ID"

digdirAdmin:
  certChain: "$?DIGDIR_ADMIN_CERT_CHAIN"
  gcpCloudKmsKeyPath: "$?DIGDIR_ADMIN_GCP_CLOUD_KMS_KEY_PATH"
  localKeyPath: "$?DIGDIR_ADMIN_LOCAL_KEY_PATH"

externalFiltering:
  enabled: "$?EXTERNAL_FILTERING_ENABLED"
  url: "$?EXTERNAL_FILTERING_URL"
  cacheSeconds: "$?EXTERNAL_FILTERING_CACHE_SECONDS"

accessLog:
  enabled: "$?ACCESS_LOG_ENABLED"

logback:
  configFile: "$?LOGBACK_CONFIG_FILE"
