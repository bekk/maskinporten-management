
name: maskinporten-management-mock

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: maskinporten-db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d maskinporten-db"]
      interval: 3s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: maskinporten-db
      DB_USER: admin
      DB_PASSWORD: admin
    ports:
      - "8090:8090"
    volumes:
      - ./local-kms:/app/local-kms:ro

volumes:
  postgres_data:
